plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}
//JaCoCo는 "내 테스트가 실제 코드를 얼마나 실행해봤는가"를 %로 측정해주는 도구
// Gradle에 JaCoCo 플러그인 적용 → 커버리지 측정 기능 활성화
// 테스트 실행(test) 후 → HTML 형태의 커버리지 리포트 생성
// build/reports/jacoco/test/html/index.html 에서 브라우저로 확인 가능
// 어떤 클래스, 어떤 라인이 테스트에 안 걸렸는지 빨간색으로 표시됨

jacocoTestReport {
    reports { html.required = true }
    dependsOn test
}
jacocoTestCoverageVerification {
    violationRules { rule { limit { minimum = 0.70 } } }
    // Line Coverage 70% 미달 시 빌드 실패
// 70%가 실행됐다"는 뜻이지 "70%가 제대로 검증됐다"는 뜻이 아님

}

group = 'com.shinhan'
version = '0.0.1-SNAPSHOT'
description = 'bananaapp'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    /*
     * =========================================================
     * 1. Spring Boot 기본 웹 기능
     * =========================================================
     */
    // Spring MVC 기반 웹 애플리케이션
    // Controller, REST API, 내장 Tomcat, Jackson 등을 포함
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Thymeleaf 서버 사이드 템플릿 엔진
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Thymeleaf 레이아웃 공통화
    // header, footer, layout 등을 재사용할 때 사용
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // AOP 기능
    // 공통 로그, 실행 시간 측정, 공통 예외 처리 등에 사용
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Bean Validation
    // @Valid, @NotBlank, @NotNull, @Size 등에 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation'


    /*
     * =========================================================
     * 2. 데이터베이스 접근
     * =========================================================
     */

    // Spring Data JPA
    // Entity, JpaRepository, Hibernate 등을 포함
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MyBatis
    // Mapper 인터페이스와 Mapper XML을 이용한 SQL 처리
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // MariaDB JDBC 드라이버
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.9'

    // Oracle JDBC 드라이버
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'


    /*
     * =========================================================
     * 3. Querydsl
     * =========================================================
     */

    // Querydsl JPA
    // Q클래스를 이용한 타입 안전 동적 쿼리 작성
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

    // Querydsl Q클래스 생성에 필요한 Annotation Processor
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'

    // Querydsl Q클래스 생성 시 필요한 Jakarta API
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'


    /*
     * =========================================================
     * 4. Spring Security
     * =========================================================
     */

    // 인증 및 인가 처리
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Thymeleaf에서 Spring Security 정보 사용
    // sec:authorize, sec:authentication 등에 사용
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'


    /*
     * =========================================================
     * 5. JWT
     * =========================================================
     */

    // JWT 생성 및 검증에 사용하는 API
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

    // JWT 실제 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'

    // JWT Claims와 Java 객체 간 JSON 변환
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'


    /*
     * =========================================================
     * 6. Redis
     * =========================================================
     */

    // Spring Data Redis
    // 기본 Redis 클라이언트로 Lettuce가 포함됨
    // Refresh Token, 캐시, 분산 데이터 저장 등에 사용
//    implementation 'org.springframework.boot:spring-boot-starter-data-redis'


    /*
     * =========================================================
     * 7. DTO 및 Entity 변환
     * =========================================================
     */

    // DTO와 Entity의 필드명이 같을 경우 자동 매핑
    implementation 'org.modelmapper:modelmapper:2.3.8'


    /*
     * =========================================================
     * 8. API 문서
     * =========================================================
     */

    // Swagger UI 및 OpenAPI 문서 자동 생성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'


    /*
     * =========================================================
     * 9. Spring Batch
     * =========================================================
     */

    // 대용량 및 정기 배치 처리
    // Job, Step, Tasklet, Chunk, Reader, Processor, Writer 등을 제공
    implementation 'org.springframework.boot:spring-boot-starter-batch'


    /*
     * =========================================================
     * 10. 모니터링
     * =========================================================
     */

    // 애플리케이션 상태 및 메트릭 확인
    // health, metrics, loggers 등의 엔드포인트 제공
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Actuator 메트릭을 Prometheus 형식으로 제공
    implementation 'io.micrometer:micrometer-registry-prometheus'


    /*
     * =========================================================
     * 11. 개발 편의 기능
     * =========================================================
     */

    // 코드 변경 시 애플리케이션 자동 재시작
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Lombok
    // @Getter, @Setter, @Builder, @RequiredArgsConstructor 등을 제공
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    /*
     * =========================================================
     * 12. 테스트
     * =========================================================
     */

    // JUnit 5, Mockito, AssertJ, MockMvc, Spring Test 등을 포함
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Spring Batch 테스트
    // JobLauncherTestUtils, JobRepositoryTestUtils 등을 제공
    testImplementation 'org.springframework.batch:spring-batch-test'

    // 테스트 코드에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JUnit 테스트 실행 런처
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트용 인메모리 DB
    // 간단한 JPA 테스트를 MariaDB 없이 빠르게 실행할 때 사용
    testRuntimeOnly 'com.h2database:h2'
    // Security 테스트
    testImplementation 'org.springframework.security:spring-security-test'
}

sourceSets {
    main {
        java {
            // Q클래스 생성 경로를 소스로 인식
            srcDirs += 'build/generated/sources/annotationProcessor/java/main'
        }
    }
}


tasks.named('test') {
    useJUnitPlatform()
}
