<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-lg" style="max-width:400px;width:100%;">
    <div class="card-body p-4">
        <h5 class="text-center fw-bold mb-4">서비스 로그인</h5>
        <!-- action 생략 → Spring Security가 자동 처리 -->
        <form method="post">
            <div class="mb-3">
                <input type="text" name="mid" class="form-control"
                       placeholder="아이디" value="member1" required>
            </div>
            <div class="mb-3">
                <input type="password" name="mpassword" class="form-control"
                       placeholder="비밀번호" value="1234" required>
            </div>
            <!-- CSRF 토큰 (csrf 활성화 시 Thymeleaf가 자동 삽입) -->
           <input type="text" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>
        <div class="text-center mt-3">
            <a href="/auth/signup">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
