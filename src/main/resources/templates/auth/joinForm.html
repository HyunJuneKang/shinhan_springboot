<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="post" action="joinProc">
    <input type="text"     name="mid"       class="form-control" placeholder="아이디">
    <input type="text"     name="mname"     class="form-control" placeholder="이름">
    <input type="password" name="mpassword" class="form-control" placeholder="비밀번호">
    <!-- 권한 선택 -->
    <div class="form-check form-check-inline">
        <input type="radio" name="mrole" value="ADMIN">  ADMIN
    </div>
    <div class="form-check form-check-inline">
        <input type="radio" name="mrole" value="MANAGER">  MANAGER
    </div>
    <div class="form-check form-check-inline">
        <input type="radio" name="mrole" value="USER" checked>  USER
    </div>
    <button type="submit" class="btn btn-primary">가입하기</button>
</form>

</body>
</html>
