<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>신한 금융 소프트 아카데미</title>
    <style>

        body{
            background:linear-gradient(135deg,#eef2ff,#f8f9fa);
            min-height:100vh;
        }

        .error-card{
            max-width:560px;
            border:none;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.15);
            animation:fadeUp .6s ease;
        }

        .error-code{
            font-size:6rem;
            font-weight:800;
            color:#dc3545;
            letter-spacing:3px;
        }

        .error-icon{
            font-size:4rem;
            color:#dc3545;
            animation:shake 3s infinite;
        }

        .btn{
            border-radius:30px;
        }

        .btn:hover{
            transform:translateY(-2px);
            transition:.2s;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @keyframes shake{
            0%,100%{transform:rotate(0deg);}
            25%{transform:rotate(6deg);}
            75%{transform:rotate(-6deg);}
        }

        .debug{
            background:#fff3cd;
            border-radius:10px;
            padding:15px;
            text-align:left;
        }

    </style>
</head>
<body>
<h1>신한금융 소프트 아카데미에 오신것을 환영합니다.</h1>
<a th:href="@{/}" class="btn btn-primary btn-lg">
    <i class="bi bi-house-door"></i>
    Account로 이동
</a>

<button class="btn btn-outline-secondary btn-lg"
        onclick="location.reload()">
    <i class="bi bi-arrow-clockwise"></i>
    새로고침
</button>
</body>
</html>
