<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/boards/list}">WEB BOARD</a>
        <a class="button primary" th:href="@{/boards/register}">새 글 작성</a>
    </div>
</header>

<main class="container page-space">
    <section class="hero compact">
        <div>
            <p class="eyebrow">Spring Data JPA · QueryDSL</p>
            <h1>게시판</h1>
            <p>동적 검색, 페이징, Ajax 댓글 예제입니다.</p>
        </div>
    </section>

    <div class="flash" th:if="${msg}" th:text="${msg}"></div>

    <section class="panel search-panel">
        <form class="search-form" method="get" th:action="@{/boards/list}">
            <label>
                <span>검색 조건</span>
                <select name="type">
                    <option value="" th:selected="${type == ''}">전체</option>
                    <option value="t" th:selected="${type == 't'}">제목</option>
                    <option value="c" th:selected="${type == 'c'}">내용</option>
                    <option value="w" th:selected="${type == 'w'}">작성자</option>
                    <option value="tc" th:selected="${type == 'tc'}">제목 + 내용</option>
                    <option value="tcw" th:selected="${type == 'tcw'}">제목 + 내용 + 작성자</option>
                </select>
            </label>

            <label class="keyword-label">
                <span>검색어</span>
                <input type="search" name="keyword" th:value="${keyword}" placeholder="검색어를 입력하세요">
            </label>

            <button class="button dark" type="submit">검색</button>
            <a class="button ghost" th:href="@{/boards/list}">초기화</a>
        </form>
    </section>

    <section class="panel table-panel">
        <div class="table-summary">
            <strong th:text="|총 ${result.totalElements}건|">총 0건</strong>
            <span th:text="|${result.number + 1} / ${T(java.lang.Math).max(result.totalPages, 1)} 페이지|">1 / 1 페이지</span>
        </div>

        <div class="table-scroll">
            <table class="board-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>등록일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="board : ${result.content}">
                    <td th:text="${board.bno}">1</td>
                    <td class="title-cell">
                        <a th:href="@{/boards/read/{bno}(bno=${board.bno})}"
                           th:text="${board.title}">제목</a>
                    </td>
                    <td th:text="${board.writer}">writer</td>
                    <td th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                </tr>
                <tr th:if="${result.empty}">
                    <td colspan="4" class="empty-row">검색 결과가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="pagination" aria-label="게시판 페이지">
            <a class="page-link"
               th:classappend="${!result.hasPrevious()} ? 'disabled' : ''"
               th:href="${result.hasPrevious()} ? @{/boards/list(page=${result.number - 1},size=${result.size},type=${type},keyword=${keyword})} : '#'"><span aria-hidden="true">←</span></a>

            <a class="page-link"
               th:each="pageNo : ${#numbers.sequence(startPage, endPage)}"
               th:classappend="${pageNo == result.number + 1} ? 'active' : ''"
               th:text="${pageNo}"
               th:href="@{/boards/list(page=${pageNo - 1},size=${result.size},type=${type},keyword=${keyword})}">1</a>

            <a class="page-link"
               th:classappend="${!result.hasNext()} ? 'disabled' : ''"
               th:href="${result.hasNext()} ? @{/boards/list(page=${result.number + 1},size=${result.size},type=${type},keyword=${keyword})} : '#'"><span aria-hidden="true">→</span></a>
        </nav>
    </section>
</main>
</body>
</html>
