<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>계좌 상세정보</title>
    <style>
        *{
            box-sizing: border-box;
            font-size:16px;
        }
        .acc-card{
            width: 300px;
            padding: 20px;
            background-color: #163a34;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow:
                    0 6px 12px rgba(0,0,0,0.3),
                    inset 0 0 0 3px #f6d77a;
            color: white;
            transition: transform 0.4s;
            cursor: pointer;
        }
        .acc-card-detail{
            width: 200px;
            padding: 20px;
            background-color: #163a34;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow:
                    0 6px 12px rgba(0,0,0,0.3),
                    inset 0 0 0 3px #f6d77a;
            color: white;
            transition: transform 0.4s;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main layout:fragment="content">
    <div class="acc-card">
        <h1 th:text="${acc.ownerName}+'직원 상세정보 조회'+ ${type}"></h1>
        <div class="acc-card-detail">
            <span>계좌 ID: </span>
            <span th:text="${acc.id}"></span>
        </div>
        <div class="acc-card-detail">
            <span>계좌번호: </span>
            <span th:text="${acc.accountNo}"></span>
        </div>
        <div class="acc-card-detail">
            <span>예금주: </span>
            <span th:text="${acc.ownerName}"></span>
        </div>
        <div class="acc-card-detail">
            <span>잔액: </span>
            <span th:text="${acc.balance}"></span>
        </div>
    </div>
    <div class="form-wrap">
        <form th:action="@{/account/update}" th:object="${accountDTO}" method="post">
            <input type="hidden" th:field="*{id}">
            <label for="accountNo">계좌번호</label>
            <input id=accountNo type="text" th:field="*{accountNo}" placeholder="계좌번호">
            <label for="ownerName">예금주</label>
            <input id=ownerName type="text" th:field="*{ownerName}" placeholder="예금주">
            <label for="balance">초기 잔액</label>
            <input id=balance type="number" th:field="*{balance}" placeholder="초기 잔액">
            <label for="accountType">초기 잔액</label>
            <select id="accountType" th:field="*{accountType}">
                <option value="SAVINGS">저축예금</option>
                <option value="CHECKING">당좌예금</option>
            </select>
            <button type="submit">수정</button>
        </form>
    </div>
    <script th:if="${msg != null}" th:inline="javascript">
        alert(/*[[${msg}]]*/ "");
    </script>
</main>
</body>


</html>
