<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>계좌 상세정보</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/style2.css}">
</head>
<body>
<main layout:fragment="content">
    <div class="form-wrap">
        <form th:action="@{/account/update}" th:object="${account}" method="post">
            <input type="hidden" th:field="*{id}">
            <label for="accountNo">계좌번호</label>
            <input id=accountNo type="text" th:field="*{accountNo}" placeholder="계좌번호">
            <label for="ownerName">예금주</label>
            <input id=ownerName type="text" th:field="*{ownerName}" placeholder="예금주">
            <label for="balance">초기 잔액</label>
            <input id=balance type="number" th:field="*{balance}" placeholder="초기 잔액">
            <label for="accountType">초기 잔액</label>
            <select id="accountType" th:field="*{accountType}">
                <option value="SAVINGS">저축예금</option>
                <option value="CHECKING">당좌예금</option>
            </select>
            <button type="submit">수정</button>
        </form>
    </div>
    <!-- ════════════════════════════════════════════════
             첨부파일 목록 — collection ResultMap 결과
             account.attachments = List<AttachmentDTO>
             MyBatis가 JOIN 결과를 자동으로 리스트로 그룹핑함
             ════════════════════════════════════════════════ -->
    <h3>첨부서류</h3>
    <table>
        <tr>
            <th>파일명</th>
            <th>종류</th>
            <th>크기</th>
            <th>관리</th>
        </tr>
        <!-- attachments 리스트 반복 -->
        <tr th:each="att : ${account.attachments}">
            <td th:text="${att.originalFilename}"></td>
            <td th:text="${att.fileType}"></td>
            <!-- 파일 크기: byte → KB 변환 -->
            <td th:text="${#numbers.formatInteger(att.fileSize / 1024, 1, 'COMMA')} + ' KB'"></td>
            <td>
                <!-- 다운로드 -->
                <a th:href="@{/account/download/{id}(id=${att.id})}">
                    다운로드
                </a>
                &nbsp;
                <!-- 삭제 -->
                <form th:action="@{/account/attachment/delete/{id}(id=${att.id})}"
                      method="post"
                      style="display:inline"
                      onsubmit="return confirm('파일을 삭제하시겠습니까?')">
                    <input type="hidden" name="accountId"
                           th:value="${account.id}">
                    <button type="submit"
                            style="color:red;border:none;background:none;cursor:pointer;">
                        삭제
                    </button>
                </form>
            </td>
        </tr>

        <!-- 첨부파일 없을 때 -->
        <tr th:if="${#lists.isEmpty(account.attachments)}">
            <td colspan="4">첨부된 서류가 없습니다.</td>
        </tr>
    </table>

    <!-- ── 파일 업로드 ─────────────────────────────────
    enctype="multipart/form-data" 필수!
─────────────────────────────────────────────── -->
    <h3>서류 첨부</h3>
    <form th:action="@{/account/{id}/upload(id=${account.id})}"
          method="post"
          enctype="multipart/form-data">
        <input type="file"
               name="file"
               accept=".jpg,.jpeg,.png,.pdf"> <!-- 파일 업로드 확장자 -->
        <button type="submit">업로드</button>
    </form>

    <script th:if="${msg != null}" th:inline="javascript">
        alert(/*[[${msg}]]*/ "");
    </script>
</main>
</body>


</html>
