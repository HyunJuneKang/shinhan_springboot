<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <meta charset="UTF-8">
    <title>Account Thymeleaf Prac</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/style2.css}">
</head>
<!-- namespace: 이름공간 , HTML기술과 thymeleaf 기술을 구별 ,
    정의시 같은 url을 준다. URL은 이름으로 부적합핟.
    그래서 접두사를 사용한다.
-->
<body>
<main layout:fragment="content">
<!-- Flash 메시지 표시 -->
<!--/*@thymesVar id="msg" type=""*/-->
<div th:if="${msg != null}" class="alert" th:text="${msg}"></div>

<a th:href="@{/account/insert}">입력</a>
<div class="search-area">
    <form action="/account/condition" method="get" class="search-form">
        <div class="search-item">
            <label for="ownerName">예금주</label>
            <input type="text"
                   id="ownerName"
                   name="ownerName"
                   th:value="${session.searchDTO != null ? session.searchDTO.ownerName : ''}"
                   placeholder="예금주명">
        </div>
        <div class="search-item">
            <label for="minBalance">최소잔액</label>
            <input type="number"
                   id="minBalance"
                   name="minBalance"
                   th:value="${session.searchDTO != null ? session.searchDTO.minBalance : ''}"
                   placeholder="최소 잔액">
        </div>
        <div class="search-item">
            <label for="maxBalance">최대잔액</label>
            <input type="number"
                   id="maxBalance"
                   name="maxBalance"
                   th:value="${session.searchDTO != null ? session.searchDTO.maxBalance : ''}"
                   placeholder="최대 잔액">
        </div>
        <div class="search-item">
            <label for="sortBy">정렬</label>
            <select id="sortBy" name="sortBy">
                <option value="">선택</option>

                <option value="balance"
                        th:selected="${session.searchDTO != null and session.searchDTO.sortBy == 'balance'}">
                    잔액순
                </option>

                <option value="name"
                        th:selected="${session.searchDTO != null and session.searchDTO.sortBy == 'name'}">
                    예금주순
                </option>

                <option value="account_no"
                        th:selected="${session.searchDTO != null and session.searchDTO.sortBy == 'account_no'}">
                    계좌번호순
                </option>
            </select>
        </div>
        <button type="submit" class="search-btn">
            조건조회
        </button>
    </form>
</div>
<table>
    <tr>
        <th>계좌번호</th><th>예금주</th><th>잔액</th><th>관리</th>
    </tr>
    <tr th:each="acc : ${accList}">
        <td th:text="${acc.id}"
            th:classappend="${lastViewAccount.equals(acc.id.toString())} ? ' text-danger'">
        </td>
        <td th:text="${acc.ownerName}"></td>
        <!-- 잔액 음수면 빨간색 -->
        <td th:text="${#numbers.formatInteger(acc.balance, 3, 'COMMA')}"
            th:class="${acc.balance < 0 ? 'text-danger' : ''}"></td>
        <td>
            <a th:href="@{/account/detail(id=${acc.id})}">상세1</a>
            <a th:href="@{/account/detail/{id}(id=${acc.id})}">상세2</a>
            <a th:href="@{/account/delete/{id}(id=${acc.id})}">삭제</a>
        </td>
    </tr>
    <!-- 데이터 없을 때 -->
    <tr th:if="${#lists.isEmpty(accList)}">
        <td colspan="4">등록된 계좌가 없습니다.</td>
    </tr>
</table>
<div id="container">
    <form action="/account/transfer" method="post">
        <label>보내는 계좌(ID)</label>
        <input type="number"
               name="fromId"
               placeholder="예 : 1"
               required>
        <label>받는 계좌(ID)</label>
        <input type="number"
               name="toId"
               placeholder="예 : 2"
               required>
        <label>이체 금액</label>
        <input type="number"
               name="amount"
               placeholder="예 : 50000"
               required>
        <button type="submit">이체하기</button>
    </form>
</div>
</main>
<script th:if="${msg != null}" th:inline="javascript">
    alert(/*[[${msg}]]*/ "");
</script>
</body>
</html>
