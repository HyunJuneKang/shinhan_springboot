<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 - 서버 오류</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#eef2ff,#f8f9fa);
            min-height:100vh;
        }

        .error-card{
            max-width:560px;
            border:none;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.15);
            animation:fadeUp .6s ease;
        }

        .error-code{
            font-size:6rem;
            font-weight:800;
            color:#dc3545;
            letter-spacing:3px;
        }

        .error-icon{
            font-size:4rem;
            color:#dc3545;
            animation:shake 3s infinite;
        }

        .btn{
            border-radius:30px;
        }

        .btn:hover{
            transform:translateY(-2px);
            transition:.2s;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @keyframes shake{
            0%,100%{transform:rotate(0deg);}
            25%{transform:rotate(6deg);}
            75%{transform:rotate(-6deg);}
        }

        .debug{
            background:#fff3cd;
            border-radius:10px;
            padding:15px;
            text-align:left;
        }

    </style>

</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card error-card">

        <div class="card-body text-center p-5">

            <i class="bi bi-exclamation-triangle-fill error-icon"></i>

            <div class="error-code mt-3">
                500
            </div>

            <h3 class="fw-bold mt-2">
                서버 내부 오류가 발생했습니다.
            </h3>

            <p class="text-secondary mt-3">
                요청을 처리하는 중 예상치 못한 문제가 발생했습니다.<br>
                잠시 후 다시 시도해 주세요.
            </p>

            <div class="d-grid gap-3 mt-4">

                <a th:href="@{/}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door"></i>
                    메인으로 이동
                </a>

                <button class="btn btn-outline-secondary btn-lg"
                        onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise"></i>
                    새로고침
                </button>

            </div>

            <hr>

            <small class="text-muted">
                문제가 계속되면 관리자에게 문의하세요.<br>
                support@springboot.com
            </small>

            <!-- 개발 중에만 표시 -->
            <div class="debug mt-4"
                 th:if="${errMessage != null}">

                <h6 class="fw-bold text-danger">
                    개발자 정보
                </h6>

                <div>
                    <strong>Message</strong><br>
                    <span th:text="${errMessage}"></span>
                </div>

                <div class="mt-2">
                    <strong>Exception</strong><br>
                    <span th:text="${errClass}"></span>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
